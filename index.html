<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#163a70">
  <meta name="description" content="Daftar Harga Pabrik Furnifan Mebel Surabaya">

  <title>Daftar Harga Furnifan</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    :root {
      --primary: #163a70;
      --primary-dark: #10294f;
      --primary-light: #2459a9;
      --accent: #60a5fa;
      --bg: #eef3f9;
      --white: #ffffff;
      --text: #172b4d;
      --muted: #64748b;
      --border: #dbe5f1;
      --header-height: 64px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
    }

    /* HEADER BIRU ELEGAN */
    header {
      position: relative;
      z-index: 10;
      flex-shrink: 0;
      min-height: var(--header-height);

      padding: 9px 20px;
      padding-top: max(9px, env(safe-area-inset-top));

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;

      color: var(--white);
      background: linear-gradient(
        120deg,
        var(--primary-dark) 0%,
        var(--primary) 55%,
        var(--primary-light) 100%
      );

      border-bottom: 1px solid rgba(255,255,255,.15);
      box-shadow: 0 3px 12px rgba(16,41,79,.20);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255,255,255,.30);
      border-radius: 12px;
      background: rgba(255,255,255,.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
    }

    .brand-icon svg {
      width: 25px;
      height: 25px;
      display: block;
    }

    .brand {
      min-width: 0;
      font-size: 16px;
      font-weight: 750;
      letter-spacing: .65px;
      line-height: 1.35;
      white-space: nowrap;
    }

    .brand small {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: .8px;
      color: #dbeafe;
      opacity: .95;
    }

    /* TOMBOL INSTAL */
    #installBtn {
      display: none;
      flex-shrink: 0;

      border: 1px solid rgba(255,255,255,.6);
      border-radius: 10px;
      padding: 10px 14px;

      background: #ffffff;
      color: var(--primary);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;

      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    #installBtn:hover {
      background: #eaf2ff;
      transform: translateY(-1px);
    }

    #installBtn:active {
      transform: scale(.97);
    }

    /* AREA APLIKASI */
    main {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: var(--white);
    }

    #appFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--white);
    }

    /* LOADING */
    #loading {
      position: absolute;
      inset: 0;
      z-index: 2;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;

      padding: 24px;
      text-align: center;
      color: var(--text);
      background: #f8fbff;

      transition: opacity .25s ease;
    }

    #loading.hidden {
      display: none;
    }

    .loading-logo {
      width: 66px;
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      background: linear-gradient(135deg, #163a70, #3478cf);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(22,58,112,.20);
    }

    .loading-logo svg {
      width: 36px;
      height: 36px;
    }

    .loading-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
    }

    .loading-subtitle {
      max-width: 280px;
      margin-top: -8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .spinner {
      width: 27px;
      height: 27px;
      border: 3px solid #dbeafe;
      border-top-color: var(--primary-light);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* TAMPILAN TABLET DAN PONSEL */
    @media (max-width: 600px) {
      :root {
        --header-height: 57px;
      }

      header {
        padding-left: 11px;
        padding-right: 11px;
        gap: 8px;
      }

      .brand-wrap {
        gap: 9px;
      }

      .brand-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
      }

      .brand-icon svg {
        width: 22px;
        height: 22px;
      }

      .brand {
        font-size: 12px;
        letter-spacing: .35px;
      }

      .brand small {
        margin-top: 2px;
        font-size: 9px;
        letter-spacing: .5px;
      }

      #installBtn {
        padding: 9px 10px;
        border-radius: 8px;
        font-size: 11px;
      }
    }

    @media (max-width: 350px) {
      .brand {
        font-size: 10px;
      }

      .brand small {
        font-size: 8px;
      }

      .brand-icon {
        width: 32px;
        height: 32px;
      }

      #installBtn {
        padding: 8px;
        font-size: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand-wrap">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"
             xmlns="http://www.w3.org/2000/svg">
          <path d="M4 20V8.5L12 4L20 8.5V20"
                stroke="white" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 20V13H16V20"
                stroke="white" stroke-width="1.7"
                stroke-linejoin="round"/>
          <path d="M8 9H8.01M12 9H12.01M16 9H16.01"
                stroke="#93C5FD" stroke-width="2.5"
                stroke-linecap="round"/>
        </svg>
      </div>

      <div class="brand">
        DAFTAR HARGA FURNIFAN
        <small>MEBEL SURABAYA</small>
      </div>
    </div>

    <button id="installBtn" type="button">
      ↓ Instal Aplikasi
    </button>
  </header>

  <main>
    <div id="loading" role="status" aria-live="polite">
      <div class="loading-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"
             xmlns="http://www.w3.org/2000/svg">
          <path d="M4 20V8.5L12 4L20 8.5V20"
                stroke="white" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 20V13H16V20"
                stroke="white" stroke-width="1.6"
                stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="loading-title">Daftar Harga Furnifan</div>

      <div class="spinner" aria-hidden="true"></div>

      <div class="loading-subtitle">
        Menghubungkan ke sistem daftar harga.<br>
        Mohon tunggu sebentar...
      </div>
    </div>

    <iframe
      id="appFrame"
      title="Aplikasi Daftar Harga Furnifan"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
      loading="eager">
    </iframe>
  </main>

  <script>
    /*
      URL WEB APP KHUSUS DAFTAR HARGA FURNIFAN
      Jangan gunakan URL aplikasi Catatan Kiriman.
    */
    const APP_URL =
      "https://script.google.com/macros/s/AKfycbxXO7QNfeFL8LlXmvbCdFOLTlKJk4upt2Nbn_7eRgmR2dArntQNKeCvluJ3aCFKOlbqTw/exec";

    const frame = document.getElementById("appFrame");
    const loading = document.getElementById("loading");
    const installBtn = document.getElementById("installBtn");

    if (!APP_URL.startsWith("https://script.google.com/")) {
      loading.querySelector(".loading-title").textContent =
        "URL aplikasi belum benar";

      loading.querySelector(".loading-subtitle").textContent =
        "Periksa kembali URL Web App Google Apps Script.";
    } else {
      frame.src = APP_URL;

      frame.addEventListener("load", () => {
        loading.classList.add("hidden");
      });
    }

    // Instalasi PWA pada browser yang mendukung prompt instalasi.
    let installPrompt = null;

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      installPrompt = event;
      installBtn.style.display = "block";
    });

    installBtn.addEventListener("click", async () => {
      if (!installPrompt) {
        alert(
          "Untuk memasang aplikasi, buka menu browser lalu pilih " +
          "'Instal aplikasi' atau 'Tambahkan ke layar utama'."
        );
        return;
      }

      installBtn.disabled = true;

      try {
        installPrompt.prompt();
        await installPrompt.userChoice;
      } catch (error) {
        console.error("Proses instalasi:", error);
      } finally {
        installPrompt = null;
        installBtn.style.display = "none";
        installBtn.disabled = false;
      }
    });

    window.addEventListener("appinstalled", () => {
      installPrompt = null;
      installBtn.style.display = "none";
    });

    // Service worker khusus repository Daftar Harga.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js", {
          scope: "./"
        }).catch((error) => {
          console.error("Service worker gagal:", error);
        });
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Harga Pabrik Furnifan Mebel Surabaya</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#0f766e">
    
    <!-- Ikon Aplikasi -->
    <link rel="png" type="image/png" sizes="192x192" href="./png-192.png">
    <link rel="apple-touch-icon" href="./png-192.png">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Masukkan URL Google Apps Script Anda di atribut src -->
    <iframe src="https://script.google.com/macros/s/AKfycbyEHdmm72dV8Kq151zerYO05aNGw8_MPSzL4f5RRDm1m2oCBVcA7evscc2PSIs97sQmNg/exec"></iframe>

    <!-- Registrasi Service Worker PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker berhasil didaftarkan:', reg.scope))
                    .catch(err => console.log('Pendaftaran Service Worker gagal:', err));
            });
        }
    </script>
</body>
</html>

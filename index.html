<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#166534">
<meta name="description" content="Daftar Harga Furnifan Mebel Surabaya">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<title>Daftar Harga - Furnifan Mebel Surabaya</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#f4f7f4;color:#173321}
header{height:54px;display:flex;align-items:center;padding:0 16px;background:#166534;color:white;font-weight:700}
main{height:calc(100dvh - 54px)}iframe{width:100%;height:100%;border:0;background:white}
.notice{padding:18px;max-width:700px;margin:8vh auto;background:white;border-radius:12px;box-shadow:0 4px 20px #0001}
button{padding:10px 16px;border:0;border-radius:8px;background:#166534;color:white;font-weight:600}
</style>
</head>
<body>
<header>Daftar Harga · Furnifan Mebel Surabaya</header>
<main id="main"></main>
<script>
/* GANTI dengan URL web app Apps Script yang sudah di-deploy (/exec). */
const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxXO7QNfeFL8LlXmvbCdFOLTlKJk4upt2Nbn_7eRgmR2dArntQNKeCvluJ3aCFKOlbqTw/exec";
const main=document.getElementById('main');
if(GAS_WEB_APP_URL.startsWith('https://script.google.com/')) {
  const frame=document.createElement('iframe');
  frame.title='Aplikasi Daftar Harga Furnifan';
  frame.allow='camera; clipboard-read; clipboard-write';
  frame.src=GAS_WEB_APP_URL;
  main.appendChild(frame);
} else {
  main.innerHTML='<section class="notice"><h2>Hubungkan aplikasi</h2><p>Di file <code>index.html</code>, ganti <code>PASTE_URL_WEB_APP_APPS_SCRIPT_DI_SINI</code> dengan URL deployment Web App Apps Script Anda yang berakhiran <code>/exec</code>.</p><p>Setelah itu simpan perubahan dan unggah ulang ke GitHub Pages.</p></section>';
}
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
</script>
</body>
</html>

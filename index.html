
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#163a70">
  <meta name="description" content="Daftar Harga Pabrik Furnifan Mebel Surabaya">

  <title>Daftar Harga Furnifan</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    :root {
      --primary: #163a70;
      --primary-dark: #10294f;
      --primary-light: #3478cf;
      --bg: #eef3f9;
      --white: #ffffff;
      --text: #172b4d;
      --muted: #64748b;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--white);
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
    }

    /* APLIKASI MEMENUHI SELURUH LAYAR */
    main {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: var(--white);
    }

    #appFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      background: var(--white);
    }

    /* LAYAR PEMUATAN */
    #loading {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 24px;
      text-align: center;
      background: #f8fbff;
      color: var(--text);
    }

    #loading.hidden {
      display: none;
    }

    .loading-logo {
      width: 68px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: linear-gradient(
        135deg,
        var(--primary),
        var(--primary-light)
      );
      box-shadow: 0 8px 24px rgba(22, 58, 112, .20);
    }

    .loading-logo svg {
      width: 38px;
      height: 38px;
    }

    .loading-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--primary);
    }

    .loading-subtitle {
      max-width: 300px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #dbeafe;
      border-top-color: var(--primary-light);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* TOMBOL INSTALASI MENGAMBANG */
    #installBtn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      position: fixed;
      left: 22px;
      right: auto;
      bottom: max(22px, env(safe-area-inset-bottom));
      z-index: 9999;
      padding: 14px 20px;
      border: 1px solid rgba(255, 255, 255, .3);
      border-radius: 50px;
      background: linear-gradient(
        135deg,
        var(--primary-dark),
        var(--primary-light)
      );
      color: #ffffff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .15px;
      box-shadow: 0 6px 22px rgba(22, 58, 112, .32);
      cursor: pointer;
      transition: transform .2s, box-shadow .2s, opacity .2s;
    }

    #installBtn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 26px rgba(22, 58, 112, .38);
    }

    #installBtn:active {
      transform: scale(.96);
    }

    #installBtn:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }

    #installBtn:disabled {
      opacity: .7;
      cursor: wait;
    }

    .install-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* TAMPILAN PONSEL */
    @media (max-width: 600px) {
      #installBtn {
        left: 14px;
        right: auto;
        bottom: max(16px, env(safe-area-inset-bottom));
        padding: 12px 16px;
        font-size: 12px;
        gap: 7px;
      }

      .install-icon {
        width: 16px;
        height: 16px;
      }
    }

    /* PONSEL DENGAN LAYAR SANGAT KECIL */
    @media (max-width: 350px) {
      #installBtn {
        left: 10px;
        right: auto;
        bottom: max(12px, env(safe-area-inset-bottom));
        padding: 11px 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <!-- LAYAR PEMUATAN -->
    <div id="loading" role="status" aria-live="polite">
      <div class="loading-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"
             xmlns="http://www.w3.org/2000/svg">
          <path d="M4 20V8.5L12 4L20 8.5V20"
                stroke="white" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 20V13H16V20"
                stroke="white" stroke-width="1.7"
                stroke-linejoin="round"/>
          <path d="M8 9H8.01M12 9H12.01M16 9H16.01"
                stroke="#93C5FD" stroke-width="2.5"
                stroke-linecap="round"/>
        </svg>
      </div>

      <div class="loading-title">Daftar Harga Furnifan</div>

      <div class="spinner" aria-hidden="true"></div>

      <div class="loading-subtitle">
        Menghubungkan ke sistem daftar harga.
        Mohon tunggu sebentar...
      </div>
    </div>

    <!-- APLIKASI GOOGLE APPS SCRIPT -->
    <iframe
      id="appFrame"
      title="Aplikasi Daftar Harga Furnifan"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
      loading="eager">
    </iframe>
  </main>

  <!-- TOMBOL INSTAL DI POJOK KIRI BAWAH -->
  <button id="installBtn" type="button">
    <svg class="install-icon"
         viewBox="0 0 24 24"
         fill="none"
         xmlns="http://www.w3.org/2000/svg"
         aria-hidden="true">
      <path d="M12 3V15M7 10L12 15L17 10"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"/>
      <path d="M5 16V20H19V16"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </svg>
    <span>Instal Aplikasi</span>
  </button>

  <script>
    "use strict";

    /*
      URL WEB APP KHUSUS DAFTAR HARGA FURNIFAN.
      Pastikan URL ini merupakan deployment yang benar.
    */
    const APP_URL =
      "https://script.google.com/macros/s/AKfycbxZuDolnexDtjynYWGDmisx3OM3EyFQYVE3p_cEGHt2Fz6uF7A8uCMAUrs0wiAUViWELQ/exec";

    const frame = document.getElementById("appFrame");
    const loading = document.getElementById("loading");
    const installBtn = document.getElementById("installBtn");
    const loadingTitle = loading.querySelector(".loading-title");
    const loadingSubtitle = loading.querySelector(".loading-subtitle");
    const spinner = loading.querySelector(".spinner");

    let loadingFinished = false;
    let loadingTimeout = null;
    let installPrompt = null;

    /* MENYELESAIKAN TAMPILAN PEMUATAN */
    function finishLoading() {
      if (loadingFinished) return;

      loadingFinished = true;

      if (loadingTimeout) {
        clearTimeout(loadingTimeout);
      }

      loading.classList.add("hidden");
    }

    /* MEMUAT APLIKASI UTAMA */
    if (
      APP_URL.startsWith("https://script.google.com/macros/s/") &&
      APP_URL.endsWith("/exec")
    ) {
      frame.addEventListener("load", () => {
        finishLoading();
      }, { once: true });

      loadingTimeout = setTimeout(() => {
        if (loadingFinished) return;

        loadingTitle.textContent =
          "Aplikasi membutuhkan waktu lebih lama";

        loadingSubtitle.textContent =
          "Periksa koneksi internet. Jika aplikasi belum terbuka, " +
          "muat ulang halaman.";

        if (spinner) {
          spinner.style.display = "none";
        }
      }, 25000);

      frame.src = APP_URL;
    } else {
      loadingTitle.textContent = "URL aplikasi belum benar";
      loadingSubtitle.textContent =
        "Periksa URL Web App Google Apps Script.";

      if (spinner) {
        spinner.style.display = "none";
      }
    }

    /*
      Jika iframe baru selesai dimuat setelah pesan timeout tampil,
      finishLoading() tetap menyembunyikan layar pemuatan.
    */

    /* MENERIMA PROMPT INSTALASI PWA */
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      installPrompt = event;
    });

    /* TOMBOL INSTALASI */
    installBtn.addEventListener("click", async () => {
      if (installPrompt) {
        const promptEvent = installPrompt;
        installPrompt = null;
        installBtn.disabled = true;

        try {
          await promptEvent.prompt();
          await promptEvent.userChoice;
        } catch (error) {
          console.error("Instalasi PWA gagal:", error);
        } finally {
          installBtn.disabled = false;
        }

        return;
      }

      /* PETUNJUK UNTUK BROWSER TANPA PROMPT OTOMATIS */
      const ua = navigator.userAgent || "";
      const isIOS = /iphone|ipad|ipod/i.test(ua);
      const isAndroid = /android/i.test(ua);

      if (isIOS) {
        alert(
          "Untuk memasang Daftar Harga Furnifan di iPhone/iPad:\n\n" +
          "1. Buka situs ini melalui Safari.\n" +
          "2. Tekan tombol Bagikan.\n" +
          "3. Pilih Tambahkan ke Layar Utama.\n" +
          "4. Tekan Tambah."
        );
      } else if (isAndroid) {
        alert(
          "Untuk memasang Daftar Harga Furnifan:\n\n" +
          "1. Buka situs ini melalui Chrome.\n" +
          "2. Buka menu ⋮.\n" +
          "3. Pilih Instal aplikasi atau Tambahkan ke layar utama."
        );
      } else {
        alert(
          "Untuk memasang Daftar Harga Furnifan di PC:\n\n" +
          "1. Buka situs ini melalui Chrome atau Edge.\n" +
          "2. Buka menu browser.\n" +
          "3. Pilih Instal aplikasi atau Install this site as an app."
        );
      }
    });

    /* SETELAH PWA BERHASIL DIPASANG */
    window.addEventListener("appinstalled", () => {
      installPrompt = null;
    });

    /* MENDAFTARKAN SERVICE WORKER */
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js", {
          scope: "./"
        }).catch((error) => {
          console.error("Service worker gagal:", error);
        });
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catatan Kiriman Pabrik Furnifan Mebel Surabaya</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
        }

        /* CONTAINER MEMENUHI SELURUH LAYAR */
        .container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* APLIKASI GOOGLE APPS SCRIPT */
        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            background: #ffffff;
        }

        /* HP DAN TABLET */
        @media screen and (max-width: 768px) {
            .container {
                width: 100%;
                height: 100%;
                height: 100vh;
                height: 100dvh;
            }

            iframe {
                width: 100%;
                height: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <iframe
            src="https://script.google.com/macros/s/AKfycbzTIgWKupG-2JBkV1Hg7Kr3oZjUL5SNsO9z3xbHFCgfm9-VR01_IQlXCFLpXoC3Zocl_w/exec"
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>

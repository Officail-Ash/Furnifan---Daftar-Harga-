<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Furnifan Mebel Surabaya</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f1ec;
        }
       
        /* APPS SCRIPT */
        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            background: white;
            border-radius: 0;
        }

        /* HP / TABLET */
        @media screen and (max-width: 768px) {

            header {
                height: 55px;
                padding: 7px 5px;
            }

            header h1 {
                font-size: 16px;
            }

            header p {
                font-size: 11px;
                margin-top: 2px;
            }

            .container {
                height: calc(100vh - 55px);
            }

            iframe {
                width: 100%;
                height: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <iframe
        src="https://script.google.com/macros/s/AKfycbwcdcwmbz4f8QyKfPzGfeLJzb-LHldHYq3cLgeN_5UB7L33KKa_bHZdcWgLFqzNnaYT9g/exec"
        allowfullscreen>
    </iframe>

</div>

</body>
</html>
